name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare app
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp icon-only.png assets/icon-only.png
          [ -f package.json ] || npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3
          [ -f capacitor.config.json ] || npx cap init "Stop Failing" com.stopfailing.app --web-dir www
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android
      - run: npx cap sync
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: stop-failing-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
